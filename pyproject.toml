[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentflow"
version = "0.2.0"
description = "A deployable AI content-marketing automation system."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "cryptography>=44,<46",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pillow>=10.4,<12.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
postgres = [
  "pgvector>=0.3,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]
s3 = [
  "boto3>=1.35,<2.0",
]
test = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6,<7",
]

[project.scripts]
contentflow = "contentflow.cli:main"
contentflow-migrate = "contentflow.migrate:main"
contentflow-worker = "contentflow.worker:main"

[tool.setuptools.packages.find]
include = ["contentflow*"]
