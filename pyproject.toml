[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contentflow"
version = "0.2.0"
description = "A deployable AI content-marketing automation system."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "cryptography>=50.0.0,<51",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pillow>=12.3,<13.0",
  "prometheus-client>=0.25,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pgvector>=0.3,<1.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "python-multipart>=0.0.18,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.35,<2.0",
]
security = [
  "pip-audit>=2.10,<3.0",
]
test = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1.0",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[project.scripts]
contentflow = "contentflow.cli:main"
contentflow-migrate = "contentflow.migrate:main"
contentflow-worker = "contentflow.worker:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


[tool.setuptools.packages.find]
include = ["contentflow*"]
