name: contentflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: "${CONTENTFLOW_RESTART_POLICY:-unless-stopped}"
    environment:
      POSTGRES_DB: contentflow
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentflow-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${CONTENTFLOW_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow -d contentflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: "${CONTENTFLOW_RESTART_POLICY:-unless-stopped}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
        mc mb --ignore-existing local/contentflow
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}

  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: "${CONTENTFLOW_RESTART_POLICY:-unless-stopped}"
    stop_grace_period: 30s
    environment:
      CONTENTFLOW_ENVIRONMENT: production
      CONTENTFLOW_DATABASE_URL: postgresql+psycopg://contentflow:${POSTGRES_PASSWORD:-contentflow-local}@postgres:5432/contentflow
      CONTENTFLOW_SECRET_KEY: ${CONTENTFLOW_SECRET_KEY:?Set CONTENTFLOW_SECRET_KEY in .env}
      CONTENTFLOW_CREDENTIAL_ENCRYPTION_KEY: ${CONTENTFLOW_CREDENTIAL_ENCRYPTION_KEY:?Set CONTENTFLOW_CREDENTIAL_ENCRYPTION_KEY in .env}
      CONTENTFLOW_CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: '${CONTENTFLOW_CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-[]}'
      CONTENTFLOW_ALLOW_REGISTRATION: ${CONTENTFLOW_ALLOW_REGISTRATION:-false}
      CONTENTFLOW_ALLOW_MOCK_PROVIDERS: ${CONTENTFLOW_ALLOW_MOCK_PROVIDERS:-false}
      CONTENTFLOW_REQUIRE_GOVERNED_PROMPTS: ${CONTENTFLOW_REQUIRE_GOVERNED_PROMPTS:-true}
      CONTENTFLOW_METRICS_ENABLED: ${CONTENTFLOW_METRICS_ENABLED:-false}
      CONTENTFLOW_METRICS_BEARER_TOKEN: ${CONTENTFLOW_METRICS_BEARER_TOKEN:-}
      CONTENTFLOW_ACCESS_TOKEN_MINUTES: ${CONTENTFLOW_ACCESS_TOKEN_MINUTES:-15}
      CONTENTFLOW_REFRESH_TOKEN_DAYS: ${CONTENTFLOW_REFRESH_TOKEN_DAYS:-14}
      CONTENTFLOW_AUTH_COOKIE_DOMAIN: ${CONTENTFLOW_AUTH_COOKIE_DOMAIN:-}
      CONTENTFLOW_TRUSTED_PROXY_HOPS: ${CONTENTFLOW_TRUSTED_PROXY_HOPS:-0}
      CONTENTFLOW_AUTH_RATE_LIMIT_ENABLED: ${CONTENTFLOW_AUTH_RATE_LIMIT_ENABLED:-true}
      CONTENTFLOW_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${CONTENTFLOW_AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      CONTENTFLOW_AUTH_RATE_LIMIT_BLOCK_SECONDS: ${CONTENTFLOW_AUTH_RATE_LIMIT_BLOCK_SECONDS:-900}
      CONTENTFLOW_AUTH_LOGIN_ACCOUNT_ATTEMPTS: ${CONTENTFLOW_AUTH_LOGIN_ACCOUNT_ATTEMPTS:-10}
      CONTENTFLOW_AUTH_LOGIN_IP_ATTEMPTS: ${CONTENTFLOW_AUTH_LOGIN_IP_ATTEMPTS:-50}
      CONTENTFLOW_AUTH_REGISTRATION_IP_ATTEMPTS: ${CONTENTFLOW_AUTH_REGISTRATION_IP_ATTEMPTS:-20}
      CONTENTFLOW_AUTH_REFRESH_SESSION_ATTEMPTS: ${CONTENTFLOW_AUTH_REFRESH_SESSION_ATTEMPTS:-120}
      CONTENTFLOW_AUTH_REFRESH_IP_ATTEMPTS: ${CONTENTFLOW_AUTH_REFRESH_IP_ATTEMPTS:-300}
      CONTENTFLOW_STORAGE_BACKEND: s3
      CONTENTFLOW_S3_ENDPOINT_URL: http://minio:9000
      CONTENTFLOW_S3_BUCKET: contentflow
      CONTENTFLOW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-contentflow}
      CONTENTFLOW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}
      CONTENTFLOW_MAX_UPLOAD_BYTES: ${CONTENTFLOW_MAX_UPLOAD_BYTES:-104857600}
      CONTENTFLOW_PUBLISH_EVIDENCE_MAX_BYTES: ${CONTENTFLOW_PUBLISH_EVIDENCE_MAX_BYTES:-10485760}
      CONTENTFLOW_PUBLISH_EVIDENCE_MAX_PIXELS: ${CONTENTFLOW_PUBLISH_EVIDENCE_MAX_PIXELS:-40000000}
      CONTENTFLOW_TEXT_PROVIDER: ${CONTENTFLOW_TEXT_PROVIDER:-mock}
      CONTENTFLOW_EMBEDDING_PROVIDER: ${CONTENTFLOW_EMBEDDING_PROVIDER:-hash}
      CONTENTFLOW_IMAGE_PROVIDER: ${CONTENTFLOW_IMAGE_PROVIDER:-mock}
      CONTENTFLOW_VIDEO_PROVIDER: ${CONTENTFLOW_VIDEO_PROVIDER:-mock}
      CONTENTFLOW_MODEL_API_BASE: ${CONTENTFLOW_MODEL_API_BASE:-}
      CONTENTFLOW_MODEL_API_KEY: ${CONTENTFLOW_MODEL_API_KEY:-}
      CONTENTFLOW_TEXT_MODEL: ${CONTENTFLOW_TEXT_MODEL:-}
      CONTENTFLOW_EMBEDDING_MODEL: ${CONTENTFLOW_EMBEDDING_MODEL:-}
      CONTENTFLOW_EMBEDDING_DIMENSIONS: ${CONTENTFLOW_EMBEDDING_DIMENSIONS:-1024}
      CONTENTFLOW_MEDIA_API_BASE: ${CONTENTFLOW_MEDIA_API_BASE:-}
      CONTENTFLOW_MEDIA_API_KEY: ${CONTENTFLOW_MEDIA_API_KEY:-}
      CONTENTFLOW_MEDIA_PROVIDER_MAX_RESPONSE_BYTES: ${CONTENTFLOW_MEDIA_PROVIDER_MAX_RESPONSE_BYTES:-33554432}
      CONTENTFLOW_MEDIA_DOWNLOAD_ALLOWED_HOSTS: '${CONTENTFLOW_MEDIA_DOWNLOAD_ALLOWED_HOSTS:-[]}'
      CONTENTFLOW_IMAGE_MODEL: ${CONTENTFLOW_IMAGE_MODEL:-}
      CONTENTFLOW_VIDEO_MODEL: ${CONTENTFLOW_VIDEO_MODEL:-}
      CONTENTFLOW_PUBLIC_BASE_URL: ${CONTENTFLOW_PUBLIC_BASE_URL:-http://localhost:8000}
      CONTENTFLOW_CORS_ORIGINS: '${CONTENTFLOW_CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3300","http://127.0.0.1:3000","http://127.0.0.1:3001","http://127.0.0.1:3300"]}'
      CONTENTFLOW_WORKER_HEARTBEAT_SECONDS: ${CONTENTFLOW_WORKER_HEARTBEAT_SECONDS:-10}
      CONTENTFLOW_WORKER_STALE_SECONDS: ${CONTENTFLOW_WORKER_STALE_SECONDS:-45}
      CONTENTFLOW_WORKER_QUEUE_STALL_SECONDS: ${CONTENTFLOW_WORKER_QUEUE_STALL_SECONDS:-300}
      CONTENTFLOW_PUBLISH_RECONCILIATION_INITIAL_DELAY_SECONDS: ${CONTENTFLOW_PUBLISH_RECONCILIATION_INITIAL_DELAY_SECONDS:-15}
      CONTENTFLOW_PUBLISH_RECONCILIATION_MAX_ATTEMPTS: ${CONTENTFLOW_PUBLISH_RECONCILIATION_MAX_ATTEMPTS:-20}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: "${CONTENTFLOW_RESTART_POLICY:-unless-stopped}"
    stop_grace_period: "${CONTENTFLOW_WORKER_STOP_GRACE_PERIOD:-10m}"
    command: ["contentflow-worker"]
    environment:
      CONTENTFLOW_ENVIRONMENT: production
      CONTENTFLOW_DATABASE_URL: postgresql+psycopg://contentflow:${POSTGRES_PASSWORD:-contentflow-local}@postgres:5432/contentflow
      CONTENTFLOW_SECRET_KEY: ${CONTENTFLOW_SECRET_KEY:?Set CONTENTFLOW_SECRET_KEY in .env}
      CONTENTFLOW_CREDENTIAL_ENCRYPTION_KEY: ${CONTENTFLOW_CREDENTIAL_ENCRYPTION_KEY:?Set CONTENTFLOW_CREDENTIAL_ENCRYPTION_KEY in .env}
      CONTENTFLOW_CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: '${CONTENTFLOW_CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-[]}'
      CONTENTFLOW_ALLOW_REGISTRATION: ${CONTENTFLOW_ALLOW_REGISTRATION:-false}
      CONTENTFLOW_ALLOW_MOCK_PROVIDERS: ${CONTENTFLOW_ALLOW_MOCK_PROVIDERS:-false}
      CONTENTFLOW_REQUIRE_GOVERNED_PROMPTS: ${CONTENTFLOW_REQUIRE_GOVERNED_PROMPTS:-true}
      CONTENTFLOW_METRICS_ENABLED: ${CONTENTFLOW_METRICS_ENABLED:-false}
      CONTENTFLOW_METRICS_BEARER_TOKEN: ${CONTENTFLOW_METRICS_BEARER_TOKEN:-}
      CONTENTFLOW_ACCESS_TOKEN_MINUTES: ${CONTENTFLOW_ACCESS_TOKEN_MINUTES:-15}
      CONTENTFLOW_REFRESH_TOKEN_DAYS: ${CONTENTFLOW_REFRESH_TOKEN_DAYS:-14}
      CONTENTFLOW_AUTH_COOKIE_DOMAIN: ${CONTENTFLOW_AUTH_COOKIE_DOMAIN:-}
      CONTENTFLOW_TRUSTED_PROXY_HOPS: ${CONTENTFLOW_TRUSTED_PROXY_HOPS:-0}
      CONTENTFLOW_AUTH_RATE_LIMIT_ENABLED: ${CONTENTFLOW_AUTH_RATE_LIMIT_ENABLED:-true}
      CONTENTFLOW_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${CONTENTFLOW_AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      CONTENTFLOW_AUTH_RATE_LIMIT_BLOCK_SECONDS: ${CONTENTFLOW_AUTH_RATE_LIMIT_BLOCK_SECONDS:-900}
      CONTENTFLOW_AUTH_LOGIN_ACCOUNT_ATTEMPTS: ${CONTENTFLOW_AUTH_LOGIN_ACCOUNT_ATTEMPTS:-10}
      CONTENTFLOW_AUTH_LOGIN_IP_ATTEMPTS: ${CONTENTFLOW_AUTH_LOGIN_IP_ATTEMPTS:-50}
      CONTENTFLOW_AUTH_REGISTRATION_IP_ATTEMPTS: ${CONTENTFLOW_AUTH_REGISTRATION_IP_ATTEMPTS:-20}
      CONTENTFLOW_AUTH_REFRESH_SESSION_ATTEMPTS: ${CONTENTFLOW_AUTH_REFRESH_SESSION_ATTEMPTS:-120}
      CONTENTFLOW_AUTH_REFRESH_IP_ATTEMPTS: ${CONTENTFLOW_AUTH_REFRESH_IP_ATTEMPTS:-300}
      CONTENTFLOW_STORAGE_BACKEND: s3
      CONTENTFLOW_S3_ENDPOINT_URL: http://minio:9000
      CONTENTFLOW_S3_BUCKET: contentflow
      CONTENTFLOW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-contentflow}
      CONTENTFLOW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}
      CONTENTFLOW_MAX_UPLOAD_BYTES: ${CONTENTFLOW_MAX_UPLOAD_BYTES:-104857600}
      CONTENTFLOW_PUBLISH_EVIDENCE_MAX_BYTES: ${CONTENTFLOW_PUBLISH_EVIDENCE_MAX_BYTES:-10485760}
      CONTENTFLOW_PUBLISH_EVIDENCE_MAX_PIXELS: ${CONTENTFLOW_PUBLISH_EVIDENCE_MAX_PIXELS:-40000000}
      CONTENTFLOW_TEXT_PROVIDER: ${CONTENTFLOW_TEXT_PROVIDER:-mock}
      CONTENTFLOW_EMBEDDING_PROVIDER: ${CONTENTFLOW_EMBEDDING_PROVIDER:-hash}
      CONTENTFLOW_IMAGE_PROVIDER: ${CONTENTFLOW_IMAGE_PROVIDER:-mock}
      CONTENTFLOW_VIDEO_PROVIDER: ${CONTENTFLOW_VIDEO_PROVIDER:-mock}
      CONTENTFLOW_MODEL_API_BASE: ${CONTENTFLOW_MODEL_API_BASE:-}
      CONTENTFLOW_MODEL_API_KEY: ${CONTENTFLOW_MODEL_API_KEY:-}
      CONTENTFLOW_TEXT_MODEL: ${CONTENTFLOW_TEXT_MODEL:-}
      CONTENTFLOW_EMBEDDING_MODEL: ${CONTENTFLOW_EMBEDDING_MODEL:-}
      CONTENTFLOW_EMBEDDING_DIMENSIONS: ${CONTENTFLOW_EMBEDDING_DIMENSIONS:-1024}
      CONTENTFLOW_MEDIA_API_BASE: ${CONTENTFLOW_MEDIA_API_BASE:-}
      CONTENTFLOW_MEDIA_API_KEY: ${CONTENTFLOW_MEDIA_API_KEY:-}
      CONTENTFLOW_MEDIA_PROVIDER_MAX_RESPONSE_BYTES: ${CONTENTFLOW_MEDIA_PROVIDER_MAX_RESPONSE_BYTES:-33554432}
      CONTENTFLOW_MEDIA_DOWNLOAD_ALLOWED_HOSTS: '${CONTENTFLOW_MEDIA_DOWNLOAD_ALLOWED_HOSTS:-[]}'
      CONTENTFLOW_IMAGE_MODEL: ${CONTENTFLOW_IMAGE_MODEL:-}
      CONTENTFLOW_VIDEO_MODEL: ${CONTENTFLOW_VIDEO_MODEL:-}
      CONTENTFLOW_PUBLIC_BASE_URL: ${CONTENTFLOW_PUBLIC_BASE_URL:-http://localhost:8000}
      CONTENTFLOW_WORKER_HEARTBEAT_SECONDS: ${CONTENTFLOW_WORKER_HEARTBEAT_SECONDS:-10}
      CONTENTFLOW_WORKER_STALE_SECONDS: ${CONTENTFLOW_WORKER_STALE_SECONDS:-45}
      CONTENTFLOW_WORKER_QUEUE_STALL_SECONDS: ${CONTENTFLOW_WORKER_QUEUE_STALL_SECONDS:-300}
      CONTENTFLOW_PUBLISH_RECONCILIATION_INITIAL_DELAY_SECONDS: ${CONTENTFLOW_PUBLISH_RECONCILIATION_INITIAL_DELAY_SECONDS:-15}
      CONTENTFLOW_PUBLISH_RECONCILIATION_MAX_ATTEMPTS: ${CONTENTFLOW_PUBLISH_RECONCILIATION_MAX_ATTEMPTS:-20}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NEXT_PUBLIC_CONTENTFLOW_API_BASE: ${NEXT_PUBLIC_CONTENTFLOW_API_BASE:-http://localhost:8000/api/v1}
    restart: "${CONTENTFLOW_RESTART_POLICY:-unless-stopped}"
    environment:
      NEXT_PUBLIC_CONTENTFLOW_API_BASE: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CONTENTFLOW_WEB_PORT:-3000}:3000"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.1-distroless@sha256:214f8427c8fba80c327bb94a75feb802ae12f2d6ca30812aa6e7d22f09bbea80
    restart: "${CONTENTFLOW_RESTART_POLICY:-unless-stopped}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${CONTENTFLOW_PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=0.0.0.0:9090
    depends_on:
      api:
        condition: service_healthy
    secrets:
      - contentflow_metrics_bearer_token
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/contentflow.rules.yml:/etc/prometheus/contentflow.rules.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana-secret-check:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test "$$(wc -c < /run/secrets/contentflow_grafana_admin_password)" -ge 32 &&
        ! cmp -s /run/secrets/contentflow_grafana_admin_password
        /run/secrets/contentflow_metrics_bearer_token
    secrets:
      - contentflow_grafana_admin_password
      - contentflow_metrics_bearer_token
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    restart: "${CONTENTFLOW_RESTART_POLICY:-unless-stopped}"
    depends_on:
      prometheus:
        condition: service_healthy
      grafana-secret-check:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: ${CONTENTFLOW_GRAFANA_ADMIN_USER:-contentflow-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/contentflow_grafana_admin_password
      GF_SERVER_ROOT_URL: ${CONTENTFLOW_GRAFANA_ROOT_URL:-http://127.0.0.1:3301}
      GF_SECURITY_COOKIE_SECURE: ${CONTENTFLOW_GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - contentflow_grafana_admin_password
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${CONTENTFLOW_GRAFANA_BIND_ADDRESS:-127.0.0.1}:${CONTENTFLOW_GRAFANA_PORT:-3301}:3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

secrets:
  contentflow_metrics_bearer_token:
    environment: CONTENTFLOW_METRICS_BEARER_TOKEN
  contentflow_grafana_admin_password:
    environment: CONTENTFLOW_GRAFANA_ADMIN_PASSWORD
