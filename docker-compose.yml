name: contentflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: contentflow
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentflow-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow -d contentflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
        mc mb --ignore-existing local/contentflow
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}

  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      CONTENTFLOW_ENVIRONMENT: production
      CONTENTFLOW_DATABASE_URL: postgresql+psycopg://contentflow:${POSTGRES_PASSWORD:-contentflow-local}@postgres:5432/contentflow
      CONTENTFLOW_SECRET_KEY: ${CONTENTFLOW_SECRET_KEY:?Set CONTENTFLOW_SECRET_KEY in .env}
      CONTENTFLOW_STORAGE_BACKEND: s3
      CONTENTFLOW_S3_ENDPOINT_URL: http://minio:9000
      CONTENTFLOW_S3_BUCKET: contentflow
      CONTENTFLOW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-contentflow}
      CONTENTFLOW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}
      CONTENTFLOW_TEXT_PROVIDER: ${CONTENTFLOW_TEXT_PROVIDER:-mock}
      CONTENTFLOW_EMBEDDING_PROVIDER: ${CONTENTFLOW_EMBEDDING_PROVIDER:-hash}
      CONTENTFLOW_IMAGE_PROVIDER: ${CONTENTFLOW_IMAGE_PROVIDER:-mock}
      CONTENTFLOW_VIDEO_PROVIDER: ${CONTENTFLOW_VIDEO_PROVIDER:-mock}
      CONTENTFLOW_CORS_ORIGINS: '${CONTENTFLOW_CORS_ORIGINS:-["http://localhost:3000","http://localhost:3300"]}'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    command: ["contentflow-worker"]
    environment:
      CONTENTFLOW_ENVIRONMENT: production
      CONTENTFLOW_DATABASE_URL: postgresql+psycopg://contentflow:${POSTGRES_PASSWORD:-contentflow-local}@postgres:5432/contentflow
      CONTENTFLOW_SECRET_KEY: ${CONTENTFLOW_SECRET_KEY:?Set CONTENTFLOW_SECRET_KEY in .env}
      CONTENTFLOW_STORAGE_BACKEND: s3
      CONTENTFLOW_S3_ENDPOINT_URL: http://minio:9000
      CONTENTFLOW_S3_BUCKET: contentflow
      CONTENTFLOW_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-contentflow}
      CONTENTFLOW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-contentflow-local-secret}
      CONTENTFLOW_TEXT_PROVIDER: ${CONTENTFLOW_TEXT_PROVIDER:-mock}
      CONTENTFLOW_EMBEDDING_PROVIDER: ${CONTENTFLOW_EMBEDDING_PROVIDER:-hash}
      CONTENTFLOW_IMAGE_PROVIDER: ${CONTENTFLOW_IMAGE_PROVIDER:-mock}
      CONTENTFLOW_VIDEO_PROVIDER: ${CONTENTFLOW_VIDEO_PROVIDER:-mock}
      CONTENTFLOW_DASHSCOPE_API_KEY: ${CONTENTFLOW_DASHSCOPE_API_KEY:-}
      CONTENTFLOW_DASHSCOPE_WORKSPACE_ID: ${CONTENTFLOW_DASHSCOPE_WORKSPACE_ID:-}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NEXT_PUBLIC_CONTENTFLOW_API_BASE: ${NEXT_PUBLIC_CONTENTFLOW_API_BASE:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_CONTENTFLOW_API_BASE: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CONTENTFLOW_WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  minio_data:
