rule_files:
  - contentflow.rules.yml

evaluation_interval: 1m

group_eval_order:
  - contentflow-recording
  - contentflow-alerts

tests:
  - name: sustained operational failures trigger bounded alerts
    interval: 1m
    input_series:
      - series: up{job="contentflow-api",instance="api:8000"}
        values: 0x20
      - series: contentflow_http_requests_total{method="GET",route="/health/ready",status_class="2xx"}
        values: 0+100x20
      - series: contentflow_http_requests_total{method="GET",route="/health/ready",status_class="5xx"}
        values: 0+10x20
      - series: contentflow_http_request_duration_seconds_bucket{method="GET",route="/health/ready",le="0.5"}
        values: 0+20x20
      - series: contentflow_http_request_duration_seconds_bucket{method="GET",route="/health/ready",le="1"}
        values: 0+80x20
      - series: contentflow_http_request_duration_seconds_bucket{method="GET",route="/health/ready",le="2.5"}
        values: 0+100x20
      - series: contentflow_http_request_duration_seconds_bucket{method="GET",route="/health/ready",le="+Inf"}
        values: 0+100x20
      - series: contentflow_worker_nodes{state="active"}
        values: 0x20
      - series: contentflow_worker_nodes{state="stale"}
        values: 1x20
      - series: contentflow_queue_oldest_ready_age_seconds
        values: 600x20
      - series: contentflow_publish_reconciliation_required
        values: 1x20
      - series: contentflow_job_manual_review_oldest_age_seconds
        values: 7200x20
      - series: contentflow_storage_allocations{status="missing"}
        values: 1x20
      - series: contentflow_storage_allocations{status="integrity_error"}
        values: 0x20
      - series: contentflow_storage_reconciliation_scheduler_enabled
        values: 1x20
      - series: contentflow_storage_reconciliation_overdue_workspaces
        values: 1x20
      - series: contentflow_storage_reconciliation_failed_jobs
        values: 0x20
      - series: contentflow_storage_delete_pending_oldest_age_seconds
        values: 90000x20
    alert_rule_test:
      - eval_time: 12m
        alertname: ContentFlowAPIDown
        exp_alerts:
          - exp_labels:
              instance: api:8000
              job: contentflow-api
              service: contentflow
              severity: critical
            exp_annotations:
              summary: ContentFlow API metrics target is unavailable
              description: Prometheus has failed to scrape the ContentFlow API for two minutes.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#故障处理
      - eval_time: 13m
        alertname: ContentFlowHighHTTP5xxRate
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: critical
            exp_annotations:
              summary: ContentFlow HTTP 5xx ratio is above 5 percent
              description: The five-minute 5xx ratio remained above 5 percent with meaningful traffic for ten minutes.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#故障处理
      - eval_time: 12m
        alertname: ContentFlowHighP95Latency
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: warning
            exp_annotations:
              summary: ContentFlow API P95 latency is above two seconds
              description: At least one route has exceeded two seconds P95 latency for ten minutes.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#故障处理
      - eval_time: 12m
        alertname: ContentFlowNoActiveWorkers
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: critical
            exp_annotations:
              summary: ContentFlow has no active Worker
              description: The database heartbeat view reports no active Worker for two minutes.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#故障处理
      - eval_time: 12m
        alertname: ContentFlowStaleWorkerDetected
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: warning
            exp_annotations:
              summary: ContentFlow has stale Worker heartbeats
              description: At least one Worker heartbeat has remained stale for five minutes.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#故障处理
      - eval_time: 12m
        alertname: ContentFlowQueueOldestReadyTooHigh
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: critical
            exp_annotations:
              summary: ContentFlow queue wait exceeds five minutes
              description: The oldest claimable queue item has exceeded five minutes for five minutes.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#故障处理
      - eval_time: 12m
        alertname: ContentFlowPublishReconciliationRequired
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: warning
            exp_annotations:
              summary: ContentFlow publish jobs require manual reconciliation
              description: One or more publish jobs have required manual reconciliation for five minutes.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#发布自动对账与人工处置
      - eval_time: 17m
        alertname: ContentFlowJobManualReviewOverdue
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: warning
            exp_annotations:
              summary: ContentFlow job manual review exceeds one hour
              description: At least one provider-side-effect review has remained unresolved for more than one hour.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#job-自动恢复与人工核对
      - eval_time: 12m
        alertname: ContentFlowStorageIntegrityAnomaly
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: critical
            exp_annotations:
              summary: ContentFlow storage ledger has integrity anomalies
              description: One or more managed objects are missing or have a physical size mismatch.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#工作区存储账本与对账
      - eval_time: 17m
        alertname: ContentFlowStorageReconciliationOverdue
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: warning
            exp_annotations:
              summary: ContentFlow storage reconciliation is overdue or failed
              description: At least one workspace is overdue for reconciliation, or a reconciliation job exhausted retries.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#工作区存储账本与对账
      - eval_time: 17m
        alertname: ContentFlowStorageDeleteBacklog
        exp_alerts:
          - exp_labels:
              service: contentflow
              severity: warning
            exp_annotations:
              summary: ContentFlow storage deletion backlog exceeds one day
              description: The oldest managed object pending physical deletion has remained queued for more than one day.
              runbook_url: https://github.com/heee000/ContentFlow/blob/main/docs/operations.md#工作区存储账本与对账
