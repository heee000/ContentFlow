global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: contentflow

rule_files:
  - /etc/prometheus/contentflow.rules.yml

scrape_configs:
  - job_name: contentflow-api
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/contentflow_metrics_bearer_token
    static_configs:
      - targets:
          - api:8000

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
