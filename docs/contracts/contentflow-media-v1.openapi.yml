openapi: 3.1.0
info:
  title: ContentFlow Media Contract
  version: 1.0.0
  description: >-
    Vendor-neutral contract between ContentFlow and an image or video generation
    service. Every successful response must echo ContentFlow-Media-Version: "1".
servers:
  - url: https://media.example.com/v1
security:
  - bearerAuth: []
paths:
  /images/generations:
    post:
      operationId: createImageGeneration
      summary: Generate one image
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
      responses:
        '200':
          description: Image generation completed
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationResponse'
        default:
          $ref: '#/components/responses/ContractError'
  /videos/generations:
    post:
      operationId: createVideoGeneration
      summary: Generate one video synchronously or asynchronously
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenerationRequest'
      responses:
        '200':
          description: Video generation completed synchronously
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationResponse'
        '202':
          description: Video generation accepted for asynchronous processing
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationResponse'
        default:
          $ref: '#/components/responses/ContractError'
  /videos/generations/{task_id}:
    get:
      operationId: getVideoGeneration
      summary: Get an asynchronous video generation
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        '200':
          description: Current generation state
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationResponse'
        default:
          $ref: '#/components/responses/ContractError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ContractVersion:
      name: ContentFlow-Media-Version
      in: header
      required: true
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Opaque key for one logical generation. Reusing the key with the same
        request returns the original result; reusing it with a different request
        returns HTTP 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[\x20-\x7E]+$'
  headers:
    ContractVersion:
      required: true
      schema:
        type: string
        const: '1'
    RetryAfter:
      description: Integer seconds before a retry, used with retryable failures.
      schema:
        type: integer
        minimum: 1
  responses:
    ContractError:
      description: Stable error envelope without stack traces or secret details
      headers:
        ContentFlow-Media-Version:
          $ref: '#/components/headers/ContractVersion'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GenerationParameters:
      type: object
      additionalProperties: false
      properties:
        ratio:
          type: string
          enum: ['3:4', '4:3', '1:1', '9:16', '16:9']
        aspect_ratio:
          type: string
          enum: ['3:4', '4:3', '1:1', '9:16', '16:9']
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 600
        shots:
          type: array
          maxItems: 100
          items: {}
    ImageGenerationRequest:
      type: object
      additionalProperties: false
      required: [model, prompt, size, parameters]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 50000
        size:
          type: string
          pattern: '^[1-9][0-9]{1,4}x[1-9][0-9]{1,4}$'
        parameters:
          $ref: '#/components/schemas/GenerationParameters'
    VideoGenerationRequest:
      type: object
      additionalProperties: false
      required: [model, prompt, parameters]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 50000
        parameters:
          $ref: '#/components/schemas/GenerationParameters'
    RequestMetadata:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          maxLength: 255
    ImageResult:
      type: object
      additionalProperties: false
      properties:
        b64_json:
          type: string
          contentEncoding: base64
        url:
          type: string
          format: uri
          maxLength: 2048
        download_url:
          type: string
          format: uri
          maxLength: 2048
        mime_type:
          type: string
          maxLength: 120
        filename:
          type: string
          maxLength: 255
      oneOf:
        - required: [b64_json]
        - required: [url]
        - required: [download_url]
    ImageGenerationResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          maxLength: 255
        requestId:
          type: string
          maxLength: 255
        data:
          oneOf:
            - $ref: '#/components/schemas/ImageResult'
            - type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/ImageResult'
      required: [data]
    VideoResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
        task_id:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum: [queued, pending, processing, running, ready, completed, succeeded]
        url:
          type: string
          format: uri
          maxLength: 2048
        download_url:
          type: string
          format: uri
          maxLength: 2048
        mime_type:
          type: string
          maxLength: 120
        filename:
          type: string
          maxLength: 255
    VideoGenerationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        request_id:
          type: string
          maxLength: 255
        requestId:
          type: string
          maxLength: 255
        data:
          $ref: '#/components/schemas/VideoResult'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        request_id:
          type: string
          maxLength: 255
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 80
            message:
              type: string
              minLength: 1
              maxLength: 500
            retryable:
              type: boolean