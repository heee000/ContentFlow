openapi: 3.1.0
info:
  title: ContentFlow Media Contract
  version: 1.0.0
  description: >-
    Vendor-neutral contract between ContentFlow and an image or video generation
    service. Every successful response must echo ContentFlow-Media-Version: "1".
servers:
  - url: https://media.example.com/v1
security:
  - bearerAuth: []
paths:
  /images/generations:
    post:
      operationId: createImageGeneration
      summary: Generate one image
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
      responses:
        '200':
          description: Image generation completed
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationResponse'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '409':
          $ref: '#/components/responses/ContractError'
        '429':
          $ref: '#/components/responses/ContractError'
        '500':
          $ref: '#/components/responses/ContractError'
        default:
          $ref: '#/components/responses/ContractError'
  /videos/generations:
    post:
      operationId: createVideoGeneration
      summary: Generate one video synchronously or asynchronously
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenerationRequest'
      responses:
        '200':
          description: Video generation completed synchronously
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationResponse'
        '202':
          description: Video generation accepted for asynchronous processing
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationResponse'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '409':
          $ref: '#/components/responses/ContractError'
        '429':
          $ref: '#/components/responses/ContractError'
        '500':
          $ref: '#/components/responses/ContractError'
        default:
          $ref: '#/components/responses/ContractError'
  /videos/generations/{task_id}:
    get:
      operationId: getVideoGeneration
      summary: Get an asynchronous video generation
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]*$'
      responses:
        '200':
          description: Current generation state
          headers:
            ContentFlow-Media-Version:
              $ref: '#/components/headers/ContractVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationResponse'
        '400':
          $ref: '#/components/responses/ContractError'
        '401':
          $ref: '#/components/responses/ContractError'
        '403':
          $ref: '#/components/responses/ContractError'
        '404':
          $ref: '#/components/responses/ContractError'
        '429':
          $ref: '#/components/responses/ContractError'
        '500':
          $ref: '#/components/responses/ContractError'
        default:
          $ref: '#/components/responses/ContractError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ContractVersion:
      name: ContentFlow-Media-Version
      in: header
      required: true
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Opaque key for one logical generation. Reusing the key with the same
        request returns the original result; reusing it with a different request
        returns HTTP 409 with error.code=idempotency_conflict. The service must
        retain the key and its canonical request identity for at least 24 hours.
        Leading or trailing whitespace is invalid; the opaque key must not be trimmed.
      x-contentflow-idempotency-retention-hours: 24
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[\x21-\x7E](?:[\x20-\x7E]*[\x21-\x7E])?$'
  headers:
    ContractVersion:
      required: true
      schema:
        type: string
        const: '1'
    RetryAfter:
      description: Integer seconds before a retry, used with retryable failures.
      schema:
        type: integer
        minimum: 1
  responses:
    ContractError:
      description: Stable error envelope without stack traces or secret details
      headers:
        ContentFlow-Media-Version:
          $ref: '#/components/headers/ContractVersion'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GenerationParameters:
      type: object
      additionalProperties: false
      properties:
        ratio:
          type: string
          enum: ['3:4', '4:3', '1:1', '9:16', '16:9']
        aspect_ratio:
          type: string
          enum: ['3:4', '4:3', '1:1', '9:16', '16:9']
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 600
        shots:
          type: array
          maxItems: 100
          x-contentflow-max-canonical-json-bytes: 262144
          items:
            $ref: '#/components/schemas/Shot'
    Shot:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 5000
          pattern: '^[^\u0000-\u001F\u007F]+$'
        - type: object
          additionalProperties: false
          minProperties: 1
          properties:
            time:
              $ref: '#/components/schemas/ShotText'
            visual:
              $ref: '#/components/schemas/ShotText'
            voiceover:
              $ref: '#/components/schemas/ShotText'
            subtitle:
              $ref: '#/components/schemas/ShotText'
    ShotText:
      type: string
      minLength: 1
      maxLength: 5000
      pattern: '^[^\u0000-\u001F\u007F]+$'
    PortableFilename:
      type: string
      minLength: 1
      maxLength: 255
      description: >-
        Cross-platform basename. It excludes filesystem control and reserved
        characters, trailing space or dot, dot-only names, and Windows device
        stems, including those followed by spaces or an extension.
      pattern: '^(?!(?:[Cc][Oo][Nn]|[Pp][Rr][Nn]|[Aa][Uu][Xx]|[Nn][Uu][Ll]|[Cc][Ll][Oo][Cc][Kk]\$|[Cc][Oo][Mm][1-9]|[Ll][Pp][Tt][1-9])(?:[ .]*\.|[ .]*$))(?!\.{1,2}$)[^<>:"/\\|?*\u0000-\u001F\u007F]*[^<>:"/\\|?* .\u0000-\u001F\u007F]$'
    ImageGenerationRequest:
      type: object
      additionalProperties: false
      required: [model, prompt, size, parameters]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^\S(?:[^\u0000-\u001F\u007F]*\S)?$'
        prompt:
          type: string
          minLength: 1
          maxLength: 50000
        size:
          type: string
          pattern: '^[1-9][0-9]{1,4}x[1-9][0-9]{1,4}$'
        parameters:
          $ref: '#/components/schemas/GenerationParameters'
    VideoGenerationRequest:
      type: object
      additionalProperties: false
      required: [model, prompt, parameters]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^\S(?:[^\u0000-\u001F\u007F]*\S)?$'
        prompt:
          type: string
          minLength: 1
          maxLength: 50000
        parameters:
          $ref: '#/components/schemas/GenerationParameters'
    RequestMetadata:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
    ImageResult:
      type: object
      additionalProperties: false
      properties:
        b64_json:
          type: string
          minLength: 4
          contentEncoding: base64
        url:
          type: string
          format: uri
          maxLength: 2048
        download_url:
          type: string
          format: uri
          maxLength: 2048
        mime_type:
          type: string
          maxLength: 120
          pattern: '^[^\s/]+/[^\s/]+$'
        filename:
          $ref: '#/components/schemas/PortableFilename'
      oneOf:
        - required: [b64_json]
        - required: [url]
        - required: [download_url]
    ImageGenerationResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        requestId:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        data:
          oneOf:
            - $ref: '#/components/schemas/ImageResult'
            - type: array
              minItems: 1
              maxItems: 1
              items:
                $ref: '#/components/schemas/ImageResult'
      required: [data]
      not:
        required: [request_id, requestId]
    VideoResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        task_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        status:
          type: string
          enum: [queued, pending, processing, running, ready, completed, succeeded, failed, cancelled, expired]
        url:
          type: string
          format: uri
          maxLength: 2048
        download_url:
          type: string
          format: uri
          maxLength: 2048
        mime_type:
          type: string
          maxLength: 120
          pattern: '^[^\s/]+/[^\s/]+$'
        filename:
          $ref: '#/components/schemas/PortableFilename'
        error:
          $ref: '#/components/schemas/ErrorDetail'
      oneOf:
        - properties:
            status:
              enum: [queued, pending, processing, running]
          anyOf:
            - required: [id]
            - required: [task_id]
          not:
            anyOf:
              - required: [url]
              - required: [download_url]
              - required: [error]
        - properties:
            status:
              enum: [ready, completed, succeeded]
          oneOf:
            - required: [url]
              not:
                required: [download_url]
            - required: [download_url]
              not:
                required: [url]
          not:
            required: [error]
        - properties:
            status:
              enum: [failed, cancelled, expired]
            error:
              allOf:
                - $ref: '#/components/schemas/ErrorDetail'
                - type: object
                  properties:
                    retryable:
                      const: false
          required: [error]
          not:
            anyOf:
              - required: [url]
              - required: [download_url]
    VideoGenerationResponse:
      type: object
      additionalProperties: false
      required: [data]
      not:
        required: [request_id, requestId]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        requestId:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        data:
          $ref: '#/components/schemas/VideoResult'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[A-Za-z0-9._-]+$'
          description: >-
            Stable machine code. Unsupported ContentFlow-Media-Version uses
            contract_version_unsupported; HTTP 409 caused by reusing an
            idempotency key with a different request uses idempotency_conflict.
        message:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F]+$'
        retryable:
          type: boolean